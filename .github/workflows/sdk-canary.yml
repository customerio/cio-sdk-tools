name: SDK canary

# Does each SDK's latest release, and its main branch, still say what `verify push` reads?
# A reworded log line or a renamed store fails here before a customer's run is misjudged.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# It only clones public SDK repos and runs node.
permissions:
  contents: read

jobs:
  sdk-canary:
    name: SDK lines verify push reads
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ['', main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run compile
      - name: Check the SDKs' ${{ matrix.ref || 'latest releases' }}
        run: node scripts/sdk-canary.js ${{ matrix.ref && format('--ref {0}', matrix.ref) || '' }}
