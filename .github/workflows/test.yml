name: Test

on: [push, pull_request]

jobs:
  test-deploy:
    name: Test able to deploy to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci

      - name: Check for known vulnerabilities
        run: npm audit

      - name: Compile
        run: npm run compile

      - name: Publish test
        # npm 11 refuses a dry run over a published version; semantic-release bumps it before the real publish.
        run: |
          npm version prerelease --preid ci --no-git-tag-version
          npm publish --dry-run --tag ci

  assert-lint:
    name: Assert lint check passes and no lint errors exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:report

      - name: Annotate Code Linting Results
        uses: ataylorme/eslint-annotate-action@5a8d8ab89a57679e90c32750e0f382e9d8570750 # 4.0.0
        with:
          check-name: 'eslint results'
          only-pr-files: false 
          fail-on-warning: false 
          fail-on-error: true 
          markdown-report-on-step-summary: true 
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          report-json: "eslint_report.json"
